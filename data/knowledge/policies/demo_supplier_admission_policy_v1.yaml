doc_version: '1.0'
supersedes: []
document_type: policy
authority: internal
category: supplier_admission
audience: procurement
effective_from: '2023-01-01'
effective_until: '2025-12-31'
source_origin: synthetic
synthetic_data: true
language: zh-CN
honest_scope_notes:
  - 内容为自制模拟制度，阈值与条款不代表任何真实企业的采购或质量政策。
  - 本办法已于 2025-12-31 失效，现行口径见 demo_supplier_admission_policy_v2。
sections:
  - key: scope
    title: 适用范围
    page: 1
    modality: text
    body: |
      本办法适用于首次申请进入合格供应商清单的供应商准入活动。
      已在清单内供应商的年度复核不适用本办法，按年度审核计划单独处理。

  - key: normal_admission
    title: 正常准入条件
    page: 2
    modality: text
    body: |
      供应商同时满足下列条件的，准予进入合格供应商清单：
      一、提交的营业执照在有效期内且字段可辨识；
      二、申请表填写的供应商名称与营业执照一致；
      三、提供报价单与交付记录两类材料。
      上述材料齐备且无异常的，由采购专员直接登记，无需提交审批。

  - key: required_documents
    title: 必需材料要求
    page: 3
    modality: text
    body: |
      准入申请必须提供营业执照、报价单与交付记录。
      质量证书与环保合规声明不属于必需材料，供应商自愿提供。
      材料不齐全时，允许供应商在准入通过后三十个日历日内补交。

  - key: approval_authority
    title: 审批权限
    page: 4
    modality: text
    body: |
      单笔预计采购金额不超过 50000 元的准入申请，由采购专员登记后直接生效。
      超过 50000 元的准入申请，需采购经理审批。
      本办法未对关键物料设置额外审批角色，关键物料按普通品类处理。

  - key: business_license_validity
    title: 营业执照有效性判定
    page: 5
    modality: text
    body: |
      营业执照标注的有效期截止日早于受理日期的，视为过期。
      过期供应商补交新执照后，本次准入结论继续有效，不重新评估其他材料。
      执照字段与申请表不一致时，以申请表为准，不额外设置人工核验环节。

  - key: effect_and_retirement
    title: 施行与废止
    page: 6
    modality: text
    body: |
      本办法自 2023-01-01 起施行，至 2025-12-31 失效。
      失效后受理的准入申请一律适用现行版本管理办法。
