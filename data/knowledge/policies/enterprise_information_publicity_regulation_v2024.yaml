honest_scope_notes:
  - 本语料只收录与供应商资格核验相关的 7 条，不是条例全文；引用时必须按节选理解，不得据此声称已覆盖条例全部义务。
  - 抓取件为地方市场监管局官网转载文本，未与国务院公报版本逐字校对；条文中的全角空格与半角括号编号均保持来源原样，留给索引前清洗处理。
  - 第十九条的规范对象是县级以上地方人民政府及其有关部门在政府采购、工程招投标等工作中的行为，不构成民营制造企业的法定义务，本期仅作为信用约束机制的边界参照，不得当作本公司准入判据的法律依据。
  - 第九条第一款第七项（从业人数、资产总额、负债总额、纳税总额等）由企业选择是否向社会公示，因此"公示系统查不到纳税或财务信息"不能作为材料不齐的判定依据。
  - 生效下限取修订决定的施行日 2024-05-01，不是 2014 年原条例施行日；2014 年原版本文未纳入本期语料库，故不声明库内前身。注意该施行日来自国务院政策吹风会对修改决定的报道，未出现在本语料抓取的页面上，成色低于其余逐字摘录的条文。
sections:
  - key: article_1_purpose
    title: 第一条 立法目的
    modality: text
    body: |-
      第一条　为了保障公平竞争，促进企业诚信自律，规范企业信息公示，强化企业信用约束，维护交易安全，提高政府监管效能，扩大社会监督，制定本条例。
  - key: article_2_definition
    title: 第二条 企业信息的定义
    modality: text
    body: |-
      第二条　本条例所称企业信息，是指在市场监督管理部门登记的企业从事生产经营活动过程中形成的信息，以及政府部门在履行职责过程中产生的能够反映企业状况的信息。
  - key: article_8_annual_report
    title: 第八条 年度报告的报送期限
    modality: text
    body: |-
      第八条　企业应当于每年1月1日至6月30日，通过国家企业信用信息公示系统向市场监督管理部门报送上一年度年度报告，并向社会公示。

      当年设立登记的企业，自下一年起报送并公示年度报告。
  - key: article_9_annual_report_content
    title: 第九条 年度报告内容与选择性公示
    modality: text
    body: |-
      第九条　企业年度报告内容包括：

      (一)企业通信地址、邮政编码、联系电话、电子邮箱等信息；

      (二)企业开业、歇业、清算等存续状态信息；

      (三)企业投资设立企业、购买股权信息；

      (四)企业为有限责任公司或者股份有限公司的，其股东或者发起人认缴和实缴的出资额、出资时间、出资方式等信息；

      (五)有限责任公司股东股权转让等股权变更信息；

      (六)企业网站以及从事网络经营的网店的名称、网址等信息；

      (七)企业从业人数、资产总额、负债总额、对外提供保证担保、所有者权益合计、营业总收入、主营业务收入、利润总额、净利润、纳税总额信息。

      前款第一项至第六项规定的信息应当向社会公示，第七项规定的信息由企业选择是否向社会公示。

      经企业同意，公民、法人或者其他组织可以查询企业选择不公示的信息。
  - key: article_10_instant_publicity
    title: 第十条 形成后 20 个工作日内公示的信息
    modality: text
    body: |-
      第十条　企业应当自下列信息形成之日起20个工作日内通过国家企业信用信息公示系统向社会公示：

      (一)有限责任公司股东或者股份有限公司发起人认缴和实缴的出资额、出资时间、出资方式等信息；

      (二)有限责任公司股东股权转让等股权变更信息；

      (三)行政许可取得、变更、延续信息；

      (四)知识产权出质登记信息；

      (五)受到行政处罚的信息；

      (六)其他依法应当公示的信息。

      市场监督管理部门发现企业未依照前款规定履行公示义务的，应当责令其限期履行。
  - key: article_18_abnormal_list
    title: 第十八条 经营异常名录与吊销营业执照
    modality: text
    body: |-
      第十八条　企业未按照本条例规定的期限公示年度报告或者未按照市场监督管理部门责令的期限公示有关企业信息的，由县级以上市场监督管理部门列入经营异常名录，并依法给予行政处罚。企业因连续2年未按规定报送年度报告被列入经营异常名录未改正，且通过登记的住所或者经营场所无法取得联系的，由县级以上市场监督管理部门吊销营业执照。
  - key: article_19_credit_restraint
    title: 第十九条 政务工作中的信用约束（适用主体见边界声明）
    modality: text
    body: |-
      第十九条　县级以上地方人民政府及其有关部门应当建立健全信用约束机制，在政府采购、工程招投标、国有土地出让、授予荣誉称号等工作中，将企业信息作为重要考量因素，对被列入经营异常名录或者市场监督管理严重违法失信名单的企业依法予以限制或者禁入。
