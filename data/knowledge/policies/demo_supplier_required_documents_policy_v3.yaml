honest_scope_notes:
  - 内容为自制模拟清单，仅用于演示规则与检索行为，不代表任何真实企业的材料要求。
  - 本清单与 VEN-002 的品类必填材料判定共用同一套品类编码，编码取值不建数据库枚举。
sections:
  - key: category_code_mapping
    title: 品类编码与名称对照
    page: 1
    modality: text
    body: |
      本清单使用下列品类编码，编码与准入申请的 category 字段取值一致：
      standard_components 表示普通工业部件，旧版清单中曾写作"普通部件"或"常规件"；
      standard_fasteners 表示普通紧固件，旧版清单中曾写作"标准件"；
      critical_material 表示关键物料；
      logistics_service 表示物流服务。
      引用旧称的历史单据按现行编码归类，但检索时旧称仍应能定位到对应行。

  - key: standard_components_required_documents
    title: 普通工业部件必需材料
    page: 2
    modality: table
    body: |
      | 品类编码 | 材料名称 | 是否必需 | 有效期要求 |
      | --- | --- | --- | --- |
      | standard_components | 营业执照 | 必需 | 截止日当天仍视为有效 |
      | standard_components | 报价单 | 必需 | 出具之日起 90 天内 |
      | standard_components | 交付记录 | 必需 | 覆盖最近 20 个交付批次 |
      | standard_components | 质量证书 | 非必需 | 自愿提供时可作为加分材料 |

  - key: standard_fasteners_required_documents
    title: 普通紧固件必需材料
    page: 3
    modality: table
    body: |
      | 品类编码 | 材料名称 | 是否必需 | 有效期要求 |
      | --- | --- | --- | --- |
      | standard_fasteners | 营业执照 | 必需 | 截止日当天仍视为有效 |
      | standard_fasteners | 报价单 | 必需 | 出具之日起 90 天内 |
      | standard_fasteners | 交付记录 | 非必需 | 首次合作可豁免 |

  - key: critical_material_required_documents
    title: 关键物料必需材料
    page: 4
    modality: table
    body: |
      | 品类编码 | 材料名称 | 是否必需 | 有效期要求 |
      | --- | --- | --- | --- |
      | critical_material | 营业执照 | 必需 | 截止日当天仍视为有效 |
      | critical_material | 质量证书 | 必需 | 剩余有效期不少于 90 天 |
      | critical_material | 报价单 | 必需 | 出具之日起 90 天内 |
      | critical_material | 交付记录 | 非必需 | 可用同品类客户合作证明替代 |

  - key: logistics_service_required_documents
    title: 物流服务必需材料
    page: 5
    modality: table
    body: |
      | 品类编码 | 材料名称 | 是否必需 | 有效期要求 |
      | --- | --- | --- | --- |
      | logistics_service | 营业执照 | 必需 | 截止日当天仍视为有效 |
      | logistics_service | 运输许可 | 必需 | 按许可证标注期限 |
      | logistics_service | 报价单 | 必需 | 出具之日起 60 天内 |

  - key: completeness_judgement
    title: 材料齐备性判定口径
    page: 6
    modality: text
    body: |
      品类必需材料集合必须是已提供材料集合的子集，才判定为材料齐备。
      判定只看材料类型是否齐备，不看材料内容是否合格；内容异常由营业执照核验类条款单独处理。
      未在本清单出现的材料类型不作为必需材料，缺失时不得据此要求补件。
      标注为"非必需"的材料，无论是否提供都不影响齐备性判定结果。
